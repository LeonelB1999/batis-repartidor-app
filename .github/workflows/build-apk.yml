name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configurar firma estable (keystore desde Secrets)
        env:
          BATIS_KEYSTORE: ${{ secrets.BATIS_KEYSTORE }}
          BATIS_STORE_PASS: ${{ secrets.BATIS_STORE_PASS }}
          BATIS_KEY_ALIAS: ${{ secrets.BATIS_KEY_ALIAS }}
          BATIS_KEY_PASS: ${{ secrets.BATIS_KEY_PASS }}
        run: |
          echo "$BATIS_KEYSTORE" | base64 -d > android/batis-release.keystore
          echo "storeFile=../batis-release.keystore" > android/keystore.properties
          echo "storePassword=$BATIS_STORE_PASS" >> android/keystore.properties
          echo "keyAlias=$BATIS_KEY_ALIAS" >> android/keystore.properties
          echo "keyPassword=$BATIS_KEY_PASS" >> android/keystore.properties
      - name: Build APK release
        run: |
          cd android
          ./gradlew assembleRelease
      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: android/app/build/outputs/apk/release/*.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          tag_name: v${{ github.run_number }}
          name: APK v${{ github.run_number }}
          body: APK generado automáticamente (carga la web en vivo).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
